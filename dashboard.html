<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radar OSINT · Admin</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1218;
            --panel: #161b26;
            --panel-2: #1e2433;
            --line: #262d3d;
            --text: #d7dbe6;
            --muted: #939bb0;
            --green: #1ed760;
            --blue: #2962ff;
            --red: #f23645;
            --amber: #f5a524;
            --violet: #a78bfa;
        }

        * {
            box-sizing: border-box;
        }

        :focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }

        body {
            margin: 0;
            display: flex;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 Inter, system-ui, sans-serif;
        }

        aside {
            width: 210px;
            padding: 20px 12px;
            background: #0b0e14;
            border-right: 1px solid var(--line);
            position: sticky;
            top: 0;
            height: 100vh;
        }

        aside h1 {
            font-size: 15px;
            margin: 0 8px 20px;
            letter-spacing: .5px;
        }

        aside h1 span {
            color: var(--green);
        }

        nav a {
            display: block;
            padding: 9px 12px;
            border-radius: 8px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
        }

        nav a:hover {
            color: var(--text);
        }

        nav a.active {
            background: var(--panel-2);
            color: var(--text);
        }

        main {
            flex: 1;
            padding: 24px 28px;
            min-width: 0;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 20px;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        a {
            color: var(--text);
        }

        .muted {
            color: var(--muted);
        }

        .up {
            color: var(--green);
        }

        .down {
            color: var(--red);
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .card-head h3 {
            margin: 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 16px;
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .kpi {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .kpi b {
            display: block;
            font-size: 26px;
        }

        .kpi span {
            color: var(--muted);
            font-size: 12px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }

        .toolbar.compact {
            margin-bottom: 10px;
        }

        .banner {
            background: #3a2c0a;
            border: 1px solid var(--amber);
            color: var(--amber);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 16px;
        }

        .table-wrap {
            overflow: auto;
            max-height: 70vh;
            border-radius: 8px;
        }

        .table-wrap.short {
            max-height: 360px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            padding: 8px;
            position: sticky;
            top: 0;
            background: var(--panel);
            z-index: 2;
            box-shadow: inset 0 -1px 0 var(--line);
            white-space: nowrap;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable:hover {
            color: var(--text);
        }

        th.sortable .sort-ind {
            display: inline-block;
            margin-left: 4px;
            font-size: 10px;
            opacity: .45;
        }

        th.sortable[aria-sort="ascending"] .sort-ind,
        th.sortable[aria-sort="descending"] .sort-ind {
            opacity: 1;
            color: var(--green);
        }

        td {
            padding: 8px;
            border-top: 1px solid var(--line);
            vertical-align: top;
        }

        tbody tr {
            content-visibility: auto;
            contain-intrinsic-size: 42px;
        }

        .table-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 12px;
            margin-top: 8px;
            border-top: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
        }

        .table-footer-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        input,
        select,
        textarea {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 10px;
            font: inherit;
        }

        input.sm,
        select.sm {
            padding: 5px 8px;
            font-size: 12px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 1px solid var(--blue);
        }

        textarea {
            width: 100%;
            margin: 8px 0;
            resize: vertical;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        label.check {
            flex-direction: row;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            align-items: end;
        }

        .btn {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 16px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .btn.sm {
            padding: 4px 11px;
            font-size: 12px;
        }

        .btn:hover {
            border-color: var(--muted);
        }

        .btn:disabled {
            opacity: .4;
            cursor: default;
        }

        .btn.primary {
            background: var(--green);
            color: #000;
            border-color: var(--green);
        }

        .btn.danger {
            color: var(--red);
        }

        .chip {
            display: inline-block;
            padding: 1px 9px;
            border-radius: 999px;
            background: var(--panel-2);
            font-size: 12px;
            margin: 0 4px 2px 0;
            border: 1px solid transparent;
        }

        .chip.alert {
            background: #3b1219;
            color: var(--red);
        }

        .chip.clickable {
            cursor: pointer;
        }

        .chip.clickable:hover {
            border-color: var(--muted);
        }

        .chip.actor {
            background: #241d3b;
            color: var(--violet);
        }

        .chip.place {
            background: #12233f;
            color: #7ea6ff;
        }

        .chip.type {
            background: transparent;
            border-color: var(--line);
            color: var(--muted);
        }

        .chip.status-active {
            background: #0f2b1b;
            color: var(--green);
        }

        .chip.status-cooling {
            background: #3a2c0a;
            color: var(--amber);
        }

        .chip.status-expired {
            background: var(--panel-2);
            color: #b4bcd0;
        }

        .event-summary {
            color: var(--muted);
            font-size: 13px;
            margin-top: 2px;
        }

        .detail {
            margin-top: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        .detail div {
            padding: 2px 0;
        }

        .detail b {
            color: var(--text);
        }

        .error {
            color: var(--red);
            font-size: 12px;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .source-url {
            font-size: 12px;
            color: var(--muted);
            max-width: 340px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .edit-row td {
            background: var(--panel-2);
            padding: 14px 16px;
        }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 130px;
        }

        .bar {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
        }

        .bar i {
            display: block;
            width: 100%;
            background: var(--blue);
            border-radius: 4px 4px 0 0;
            min-height: 2px;
        }

        .bar span {
            font-size: 12px;
            color: var(--muted);
        }

        .spark {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 22px;
        }

        .spark i {
            display: block;
            width: 6px;
            background: var(--green);
            opacity: .8;
        }

        .digest h3 {
            color: var(--text);
            text-transform: none;
            font-size: 16px;
            margin-top: 18px;
        }

        .digest li {
            margin-left: 18px;
        }

        /* ---- Mapa (Mapbox GL JS) ---- */
        .map-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }

        .map-meta p {
            margin: 0;
        }

        .map-legend {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 12px;
            color: var(--muted);
        }

        .map-legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .map-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid currentColor;
        }

        .map-dot.active {
            color: var(--green);
            background: rgba(30, 215, 96, .35);
        }

        .map-dot.inactive {
            color: var(--muted);
            background: rgba(147, 155, 176, .3);
        }

        #event-map {
            height: 68vh;
            min-height: 380px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #0b0e14;
            overflow: hidden;
        }

        #event-map .mapboxgl-popup-content {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 34px 12px 14px;
            font: 13px/1.5 Inter, system-ui, sans-serif;
            max-height: 300px;
            overflow: auto;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .65);
        }

        #event-map .mapboxgl-popup-content a {
            color: #7ea6ff;
        }

        #event-map .mapboxgl-popup-close-button {
            color: var(--muted);
            font-size: 18px;
            width: 28px;
            height: 28px;
            top: 6px;
            right: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
        }

        #event-map .mapboxgl-popup-close-button:hover,
        #event-map .mapboxgl-popup-close-button:focus-visible {
            background: var(--panel-2);
            color: var(--text);
        }

        #event-map .mapboxgl-popup-anchor-top .mapboxgl-popup-tip,
        #event-map .mapboxgl-popup-anchor-top-left .mapboxgl-popup-tip,
        #event-map .mapboxgl-popup-anchor-top-right .mapboxgl-popup-tip {
            border-bottom-color: var(--panel);
        }

        #event-map .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip,
        #event-map .mapboxgl-popup-anchor-bottom-left .mapboxgl-popup-tip,
        #event-map .mapboxgl-popup-anchor-bottom-right .mapboxgl-popup-tip {
            border-top-color: var(--panel);
        }

        #event-map .mapboxgl-popup-anchor-left .mapboxgl-popup-tip {
            border-right-color: var(--panel);
        }

        #event-map .mapboxgl-popup-anchor-right .mapboxgl-popup-tip {
            border-left-color: var(--panel);
        }

        #event-map .mapboxgl-ctrl-group {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
            overflow: hidden;
        }

        #event-map .mapboxgl-ctrl-group button {
            background-color: transparent;
            width: 32px;
            height: 32px;
        }

        #event-map .mapboxgl-ctrl-group button+button {
            border-top: 1px solid var(--line);
        }

        #event-map .mapboxgl-ctrl-group button:hover,
        #event-map .mapboxgl-ctrl-group button:focus-visible {
            background-color: var(--panel-2);
        }

        #event-map .mapboxgl-ctrl-group button .mapboxgl-ctrl-icon {
            filter: invert(0.9);
        }

        #event-map .mapboxgl-ctrl-group button:disabled .mapboxgl-ctrl-icon {
            opacity: .35;
        }

        #event-map .mapboxgl-ctrl-attrib {
            background-color: rgba(15, 18, 24, .88);
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 6px;
            margin: 0 8px 8px 0;
            padding: 2px 8px;
            font-size: 11px;
            backdrop-filter: blur(4px);
        }

        #event-map .mapboxgl-ctrl-attrib a {
            color: var(--text);
            text-decoration: none;
        }

        #event-map .mapboxgl-ctrl-attrib a:hover {
            text-decoration: underline;
        }

        #event-map .mapboxgl-ctrl-attrib.mapboxgl-compact {
            background-color: rgba(15, 18, 24, .92);
            padding: 0;
            min-height: 26px;
            min-width: 26px;
            border-radius: 999px;
        }

        #event-map .mapboxgl-ctrl-attrib.mapboxgl-compact-show {
            padding: 2px 28px 2px 10px;
        }

        #event-map .mapboxgl-ctrl-attrib-button {
            background-color: transparent;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='%23d7dbe6'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z'/%3E%3C/svg%3E");
            background-position: center;
            background-repeat: no-repeat;
            background-size: 18px 18px;
            width: 26px;
            height: 26px;
            border-radius: 999px;
        }

        #event-map .mapboxgl-ctrl-attrib-button:hover {
            background-color: var(--panel-2);
        }

        .map-popup-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .map-popup-item {
            padding: 6px 0;
            border-top: 1px solid var(--line);
        }

        .map-popup-meta {
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 16px;
            display: none;
            max-width: 420px;
            z-index: 2000;
        }

        #toast.error {
            border-color: var(--red);
            color: var(--red);
        }
    </style>
</head>

<body>
    <aside>
        <h1>RADAR <span>OSINT</span></h1>
        <nav>
            <a href="#overview" data-view="overview">Resumen</a>
            <a href="#events" data-view="events">Eventos</a>
            <a href="#map" data-view="map">Mapa</a>
            <a href="#entities" data-view="entities">Entidades</a>
            <a href="#articles" data-view="articles">Artículos</a>
            <a href="#categories" data-view="categories">Categorías</a>
            <a href="#sources" data-view="sources">Fuentes</a>
            <a href="#digest" data-view="digest">Briefing</a>
            <a href="#settings" data-view="settings">Ajustes</a>
        </nav>
    </aside>
    <main>
        <div id="view"></div>
    </main>
    <div id="toast"></div>

    <script>
        // ---------- Utilidades ----------
        const $ = (selector) => document.querySelector(selector);
        const esc = (value) =>
            String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
        const safeHref = (url) => (/^https?:\/\//i.test(url) ? esc(url) : "#");
        const formatTime = (ts) => (ts ? new Date(ts).toLocaleString("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "—");
        const timeAgo = (ts) => {
            if (!ts) return "nunca";
            const minutes = Math.round((Date.now() - ts) / 60000);
            if (minutes < 1) return "ahora";
            if (minutes < 60) return `hace ${minutes} min`;
            const hours = Math.round(minutes / 60);
            return hours < 48 ? `hace ${hours} h` : `hace ${Math.round(hours / 24)} d`;
        };
        const chips = (names) => names.map((name) => `<span class="chip">${esc(name)}</span>`).join("");

        function markdown(text) {
            const bold = (line) => line.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
            return esc(text).split("\n").map((line) => {
                const heading = line.match(/^#{1,4}\s+(.*)/);
                if (heading) return `<h3>${bold(heading[1])}</h3>`;
                if (/^[-*]\s/.test(line)) return `<li>${bold(line.slice(2))}</li>`;
                return line.trim() ? `<p>${bold(line)}</p>` : "";
            }).join("");
        }

        function toast(message, isError = false) {
            const box = $("#toast");
            box.textContent = message;
            box.className = isError ? "error" : "";
            box.style.display = "block";
            setTimeout(() => (box.style.display = "none"), 4000);
        }

        function debounce(fn, delay = 160) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        // ---------- API ----------
        let token = localStorage.getItem("adminToken") ?? "";

        async function api(path, { method = "GET", body, signal } = {}) {
            const headers = { "content-type": "application/json" };
            if (token) headers.authorization = `Bearer ${token}`;

            const response = await fetch(`/api${path}`, {
                method,
                headers,
                body: body === undefined ? undefined : JSON.stringify(body),
                signal,
            });

            if (response.status === 401) {
                const input = prompt("Token de administrador (ADMIN_TOKEN):");
                if (input === null) throw new Error("Token requerido");
                token = input.trim();
                localStorage.setItem("adminToken", token);
                return api(path, { method, body, signal });
            }
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error ?? `HTTP ${response.status}`);
            }
            return response.json();
        }

        // ---------- Estado de la interfaz ----------
        const state = {
            eventHours: 24,
            eventStatus: "",
            eventType: "",
            eventsClient: { q: "", category: "", enriched: "", minSources: 0 },
            articles: { q: "", category: "", source: "", status: "", offset: 0, limit: 100 },
            entities: { kind: "", hours: 168, q: "", subtype: "", country: "", hasCoords: "", minEvents: 0 },
            entityId: null,
            sources: { q: "", type: "", onlyErrors: false, enabled: "" },
            editingSourceId: null,
            overview: { trendQ: "", onlyAnomalies: false, runQ: "", runStatus: "" },
            sorts: {
                "overview-actors": { key: "recent_events", dir: "desc" },
                "overview-places": { key: "recent_events", dir: "desc" },
                "overview-trends": { key: "zScore", dir: "desc" },
                "overview-runs": { key: "started_at", dir: "desc" },
                "events": { key: "first_seen_at", dir: "desc" },
                "entities": { key: "recent_events", dir: "desc" },
                "entity-events": { key: "first_seen_at", dir: "desc" },
                "articles": { key: "published_at", dir: "desc" },
                "sources": { key: "articles_total", dir: "desc" },
            },
            pages: {
                "events": { page: 0, pageSize: 100 },
                "entities": { page: 0, pageSize: 100 },
                "sources": { page: 0, pageSize: 100 },
                "overview-trends": { page: 0, pageSize: 50 },
                "overview-runs": { page: 0, pageSize: 50 },
            },
        };

        const HOUR_LABELS = { 24: "Últimas 24 h", 48: "Últimas 48 h", 168: "Últimos 7 días", 720: "Últimos 30 días" };
        const ENTITY_HOUR_LABELS = { 24: "24 h", 168: "7 días", 720: "30 días", 0: "Todo el histórico" };
        const STATUS_LABELS = { active: "Activo", cooling: "Enfriándose", expired: "Caducado" };
        const STATUS_RANK = { active: 3, cooling: 2, expired: 1 };

        const statusChip = (status) => `<span class="chip status-${esc(status)}">${esc(STATUS_LABELS[status] ?? status)}</span>`;
        const entityTitle = (e) => [e.role, e.subtype, e.country_code, e.lat != null ? `${e.lat.toFixed(2)}, ${e.lon.toFixed(2)}` : ""].filter(Boolean).join(" · ");
        const entityChip = (e, cls) =>
            `<span class="chip clickable ${cls}" data-action="open-entity" data-id="${e.id}" title="${esc(entityTitle(e))}">${esc(e.name)}</span>`;
        const entityLink = (e) => `<a href="#" data-action="open-entity" data-id="${e.id}">${esc(e.name)}</a>`;
        const options = (items, selected, label = (item) => item.name, value = (item) => item.id) =>
            items.map((item) => `<option value="${esc(value(item))}" ${String(value(item)) === String(selected) ? "selected" : ""}>${esc(label(item))}</option>`).join("");

        // ---------- Motor de tablas: ordenación, paginación y renderizado progresivo ----------
        const collator = new Intl.Collator("es", { sensitivity: "base", numeric: true });
        const tableRegistry = new Map();
        const tableObservers = new Map();
        const CHUNK_SIZE = 100;

        function compareValues(a, b, type, dir) {
            const mul = dir === "asc" ? 1 : -1;
            const aEmpty = a === null || a === undefined || a === "" || (typeof a === "number" && Number.isNaN(a));
            const bEmpty = b === null || b === undefined || b === "" || (typeof b === "number" && Number.isNaN(b));
            if (aEmpty && bEmpty) return 0;
            if (aEmpty) return 1;
            if (bEmpty) return -1;
            if (type === "number" || type === "date") return (Number(a) - Number(b)) * mul;
            if (type === "boolean") return ((a ? 1 : 0) - (b ? 1 : 0)) * mul;
            return collator.compare(String(a), String(b)) * mul;
        }

        function clearTableObservers() {
            for (const observer of tableObservers.values()) observer.disconnect();
            tableObservers.clear();
        }

        function disconnectTableObserver(tableId) {
            const observer = tableObservers.get(tableId);
            if (observer) {
                observer.disconnect();
                tableObservers.delete(tableId);
            }
        }

        function tableShell(tableId, columns, { wrapClass = "" } = {}) {
            const sort = state.sorts[tableId];
            return `
        <div class="table-wrap ${wrapClass}" id="wrap-${tableId}">
          <table>
            <thead>
              <tr>${columns.map((col) => {
                if (!col.sortKey) return `<th>${esc(col.label)}</th>`;
                const active = sort && sort.key === col.sortKey;
                const ariaSort = active ? (sort.dir === "asc" ? "ascending" : "descending") : "none";
                const arrow = active ? (sort.dir === "asc" ? "▲" : "▼") : "↕";
                return `<th class="sortable" data-sort-table="${tableId}" data-sort-key="${col.sortKey}" aria-sort="${ariaSort}" title="Ordenar por ${esc(col.label)}">${esc(col.label)}<span class="sort-ind">${arrow}</span></th>`;
            }).join("")}</tr>
            </thead>
            <tbody id="tbody-${tableId}"></tbody>
          </table>
        </div>
        <div id="footer-${tableId}"></div>`;
        }

        function updateSortHeaders(tableId) {
            const sort = state.sorts[tableId];
            document.querySelectorAll(`th[data-sort-table="${tableId}"]`).forEach((th) => {
                const active = sort && sort.key === th.dataset.sortKey;
                th.setAttribute("aria-sort", active ? (sort.dir === "asc" ? "ascending" : "descending") : "none");
                const ind = th.querySelector(".sort-ind");
                if (ind) ind.textContent = active ? (sort.dir === "asc" ? "▲" : "▼") : "↕";
            });
        }

        function mountTable(tableId, config) {
            tableRegistry.set(tableId, config);
            renderTable(tableId);
        }

        function renderTable(tableId) {
            const config = tableRegistry.get(tableId);
            const tbody = $(`#tbody-${tableId}`);
            if (!config || !tbody) return;

            disconnectTableObserver(tableId);
            updateSortHeaders(tableId);

            const { columns, rows, filterFn, rowHtml, emptyHtml, disablePagination = false, colSpan = columns.length } = config;
            const filtered = filterFn ? rows.filter(filterFn) : rows;

            // Ordenar
            const sort = state.sorts[tableId];
            let sorted = filtered;
            if (sort) {
                const col = columns.find((c) => c.sortKey === sort.key);
                if (col) {
                    const getVal = col.getValue ?? ((r) => r[col.sortKey]);
                    const type = col.type ?? "string";
                    sorted = [...filtered].sort((a, b) => compareValues(getVal(a), getVal(b), type, sort.dir));
                }
            }

            // Paginar en cliente (o mostrar todo con carga progresiva por bloques)
            let visibleRows = sorted;
            let pageState = state.pages[tableId];
            let totalPages = 1;
            let startIdx = 0;

            if (!disablePagination && pageState) {
                const size = pageState.pageSize;
                if (size > 0 && Number.isFinite(size)) {
                    totalPages = Math.max(1, Math.ceil(sorted.length / size));
                    if (pageState.page >= totalPages) pageState.page = totalPages - 1;
                    if (pageState.page < 0) pageState.page = 0;
                    startIdx = pageState.page * size;
                    visibleRows = sorted.slice(startIdx, startIdx + size);
                } else {
                    pageState.page = 0;
                }
            }

            if (!visibleRows.length) {
                tbody.innerHTML = emptyHtml ?? `<tr><td colspan="${colSpan}" class="muted">Sin resultados</td></tr>`;
            } else if (visibleRows.length <= CHUNK_SIZE) {
                tbody.innerHTML = visibleRows.map(rowHtml).join("");
            } else {
                // Renderizado progresivo por bloques para grandes volúmenes sin bloquear el hilo principal
                let rendered = CHUNK_SIZE;
                tbody.innerHTML = visibleRows.slice(0, rendered).map(rowHtml).join("") +
                    `<tr id="sentinel-${tableId}"><td colspan="${colSpan}" class="muted">Cargando más filas (${rendered}/${visibleRows.length})…</td></tr>`;

                const sentinel = $(`#sentinel-${tableId}`);
                const wrap = $(`#wrap-${tableId}`);
                if (sentinel && "IntersectionObserver" in window) {
                    const observer = new IntersectionObserver((entries) => {
                        if (!entries.some((e) => e.isIntersecting)) return;
                        const next = Math.min(visibleRows.length, rendered + CHUNK_SIZE);
                        const html = visibleRows.slice(rendered, next).map(rowHtml).join("");
                        sentinel.insertAdjacentHTML("beforebegin", html);
                        rendered = next;
                        if (rendered >= visibleRows.length) {
                            observer.disconnect();
                            tableObservers.delete(tableId);
                            sentinel.remove();
                        } else {
                            sentinel.firstElementChild.textContent = `Cargando más filas (${rendered}/${visibleRows.length})…`;
                        }
                    }, { root: wrap, rootMargin: "240px" });
                    observer.observe(sentinel);
                    tableObservers.set(tableId, observer);
                } else if (sentinel) {
                    sentinel.remove();
                    tbody.innerHTML = visibleRows.map(rowHtml).join("");
                }
            }

            // Pie de tabla
            const footer = $(`#footer-${tableId}`);
            if (footer && !disablePagination && pageState) {
                const total = sorted.length;
                const showingEnd = Math.min(total, startIdx + visibleRows.length);
                const size = pageState.pageSize;
                const pageSizes = [50, 100, 250, 500, 0];
                footer.innerHTML = `
          <div class="table-footer">
            <div>${total === 0 ? "0 resultados" : `Mostrando <b>${startIdx + 1}–${showingEnd}</b> de <b>${total}</b>${total !== rows.length ? ` (filtrados de ${rows.length})` : ""}`}</div>
            <div class="table-footer-controls">
              <label style="flex-direction:row;align-items:center;gap:6px">Filas:
                <select class="sm" data-table-pagesize="${tableId}">
                  ${pageSizes.map((s) => `<option value="${s}" ${s === size ? "selected" : ""}>${s === 0 ? "Todos" : s}</option>`).join("")}
                </select>
              </label>
              ${size > 0 && totalPages > 1 ? `
                <button class="btn sm" data-table-page="${tableId}" data-step="-1" ${pageState.page === 0 ? "disabled" : ""}>← Anterior</button>
                <span>Página ${pageState.page + 1} / ${totalPages}</span>
                <button class="btn sm" data-table-page="${tableId}" data-step="1" ${pageState.page >= totalPages - 1 ? "disabled" : ""}>Siguiente →</button>
              ` : ""}
            </div>
          </div>`;
            } else if (footer && sorted.length > 0) {
                footer.innerHTML = `<div class="table-footer"><div><b>${sorted.length}</b> ${sorted.length === 1 ? "fila" : "filas"}${sorted.length !== rows.length ? ` (filtradas de ${rows.length})` : ""}</div></div>`;
            } else if (footer) {
                footer.innerHTML = "";
            }
        }

        // ---------- Vistas ----------
        const kpi = (label, value, extraClass = "") => `<div class="kpi"><b class="${extraClass}">${value}</b><span>${label}</span></div>`;

        const OVERVIEW_ENTITY_COLS = [

        const RUN_COLS = [

        function buildMapData(events) {

            let located = 0;
            for (const event of events) {
                const place = primaryPlace(event);
                if (!place) continue;
                located++;
                const group = groups.get(place.id) ?? { place, events: [] };
                group.events.push(event);
                groups.set(place.id, group);
            }

            const features = [...groups.values()].map(({ place, events: list }) => {
                const sources = list.reduce((sum, e) => sum + e.source_count, 0);
                return {
                    type: "Feature",
                    geometry: { type: "Point", coordinates: [place.lon, place.lat] },
                    properties: {
                        id: place.id,
                        radius: 5 + Math.min(18, Math.sqrt(sources) * 2.5),
                        active: list.some((e) => e.status === "active"),
                    },
                };
            });

            return { groups, features, located, total: events.length };
        }

        function computeBounds(mapboxgl, features) {
            if (!features.length) return null;
            const bounds = new mapboxgl.LngLatBounds();
            for (const feature of features) bounds.extend(feature.geometry.coordinates);
            return bounds;
        }

        async function fetchMapEvents() {
            mapAbort?.abort();
            mapAbort = new AbortController();
            const query = new URLSearchParams({ hours: state.eventHours, limit: 200 });
            if (state.eventStatus) query.set("status", state.eventStatus);
            return api(`/events?${query}`, { signal: mapAbort.signal });
        }

        function addEventLayers(initialFeatures) {
            map.addSource("events", {
                type: "geojson",
                data: { type: "FeatureCollection", features: initialFeatures },
            });
            const color = ["case", ["get", "active"], "#1ed760", "#939bb0"];
            map.addLayer({
                id: "events-circles",
                type: "circle",
                source: "events",
                layout: { "circle-sort-key": ["-", ["get", "radius"]] },
                paint: {
                    "circle-radius": ["get", "radius"],
                    "circle-color": color,
                    "circle-opacity": 0.35,
                    "circle-stroke-width": 2,
                    "circle-stroke-color": color,
                },
            });

            map.on("click", "events-circles", (event) => {
                const feature = event.features?.[0];
                const group = feature && mapGroups.get(Number(feature.properties.id));
                if (!group) return;

                const coordinates = feature.geometry.coordinates.slice();
                while (Math.abs(event.lngLat.lng - coordinates[0]) > 180) {
                    coordinates[0] += event.lngLat.lng > coordinates[0] ? 360 : -360;
                }
                mapPopup?.remove();
                mapPopup = new window.mapboxgl.Popup({ maxWidth: "360px", offset: Number(feature.properties.radius) + 2 })
                    .setLngLat(coordinates)
                    .setHTML(popupHtml(group))
                    .addTo(map);
            });
            map.on("mouseenter", "events-circles", () => { map.getCanvas().style.cursor = "pointer"; });
            map.on("mouseleave", "events-circles", () => { map.getCanvas().style.cursor = ""; });
        }

        function createMap(mapboxgl, accessToken, { initialFeatures, bounds }) {
            mapboxgl.accessToken = accessToken;
            const mapOptions = {
                container: mapEl,
                style: MAP_STYLE,
                projection: "mercator",
            };
            if (bounds) {
                mapOptions.bounds = bounds;
                mapOptions.fitBoundsOptions = { padding: 70, maxZoom: 5 };
                mapFitted = true;
            } else {
                mapOptions.center = [20, 30];
                mapOptions.zoom = 1.6;
            }

            map = new mapboxgl.Map(mapOptions);
            map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
            mapLoaded = new Promise((resolve) => map.once("load", () => { addEventLayers(initialFeatures); resolve(); }));

            map.on("error", (event) => {
                const status = event.error?.status;
                if (status !== 401 && status !== 403) return;
                map.remove();
                map = undefined;
                mapboxToken = undefined;
                mapFitted = false;
                const message = "Mapbox rechazó el token (¿caducado, sin permisos o restringido a otras URL?)";
                $("#map-slot")?.replaceChildren(Object.assign(document.createElement("div"), { className: "banner", textContent: message }));
                const count = $("#map-count");
                if (count) count.textContent = "";
                toast(message, true);
            });
        }

        function updateMapCount(data) {

        }

        async function refreshMapData({ fit = false } = {}) {
            try {
                const events = await fetchMapEvents();
                await mapLoaded;

                const data = buildMapData(events);
                mapGroups = data.groups;

                mapPopup?.remove();
                map.getSource("events").setData({ type: "FeatureCollection", features: data.features });

                if (fit && data.features.length) {
                    const bounds = computeBounds(window.mapboxgl, data.features);
                    map.fitBounds(bounds, { padding: 70, maxZoom: 5, duration: 500 });
                    mapFitted = true;
                }

                updateMapCount(data);
            } catch (error) {
                if (error.name !== "AbortError") toast(error.message, true);
            }
        }

                            if (filters.enabled === "on" && !source.enabled) return false;
                            if (filters.enabled === "off" && source.enabled) return false;
                            if (filters.q) {
                                const needle = filters.q.toLowerCase();
                                if (!source.name.toLowerCase().includes(needle) && !source.url.toLowerCase().includes(needle)) return false;
                            }
                            return true;
                        },
                        rowHtml: (source) => `
              <tr>
                <td><input type="checkbox" data-action="toggle-source" data-id="${source.id}" ${source.enabled ? "checked" : ""}></td>
                <td>
                  <div>${esc(source.name)}</div>
                  <div class="source-url" title="${esc(source.url)}">${esc(source.url)}</div>
                </td>
                <td class="muted">${source.type}</td>
                <td>${source.interval_minutes} min</td>
                <td class="muted">${timeAgo(source.last_fetched_at)}</td>
                <td>${source.articles_total}</td>
                <td class="error" title="${esc(source.last_error)}">${esc(source.last_error)}</td>
                <td><div class="actions-cell">
                    <button class="btn" data-action="edit-source" data-id="${source.id}">${state.editingSourceId === source.id ? "Cerrar" : "Editar"}</button>
                    <button class="btn" data-action="fetch-source" data-id="${source.id}">Descargar</button>
                    <button class="btn danger" data-action="delete-source" data-id="${source.id}">×</button>
                </div></td>
              </tr>
              ${state.editingSourceId === source.id ? sourceEditRow(source) : ""}`,
                        emptyHtml: `<tr><td colspan="8" class="muted">Sin fuentes que coincidan con el filtro</td></tr>`,
                    });
                },
            };
        }

        const SETTING_GROUPS = [
            ["Eventos", {
                eventSimilarity: "Similitud mínima para agrupar en un evento (0.5 – 0.99)",
                eventWindowHours: "Ventana de agrupación: sin noticias más tiempo que esto = caducado (horas)",
                eventActiveMinHours: "Horas mínimas sin noticias antes de dejar de estar activo",
            }],
            ["Enriquecimiento (actores y lugares)", {
                enrichEnabled: "Enriquecimiento con LLM activado",
                enrichMinSources: "Medios mínimos para enriquecer un evento",
                enrichMaxEventsPerRun: "Eventos como máximo por ciclo",
                entityMergeSimilarity: "Similitud mínima para fusionar entidades duplicadas (0.7 – 0.99)",
                geocodingEnabled: "Geocodificación de lugares activada",
                entityRetentionDays: "Retención de entidades sin eventos (días)",
            }],
            ["Datos y planificador", {
                maxArticleAgeHours: "Antigüedad máxima de artículos al descargar (horas)",
                retentionDays: "Retención de artículos y eventos (días)",
                schedulerEnabled: "Planificador automático activado",
            }],
        ];
        const FLAG_SETTINGS = new Set(["schedulerEnabled", "enrichEnabled", "geocodingEnabled"]);

        async function settingsView() {
            const settings = await api("/settings");
            const field = ([key, label]) => FLAG_SETTINGS.has(key)
                ? `<label class="check"><input type="checkbox" name="${key}" ${settings[key] ? "checked" : ""}> ${label}</label>`
                : `<label>${label}<input type="number" step="any" name="${key}" value="${settings[key]}"></label>`;

            return `<h2>Ajustes</h2>
    <form data-form="settings">
      ${SETTING_GROUPS.map(([title, fields]) => `<div class="card"><h3>${title}</h3><div class="form-grid">${Object.entries(fields).map(field).join("")}</div></div>`).join("")}
      <button class="btn primary">Guardar</button>
    </form>`;
        }

        async function digestView() {
            const digest = await api("/digest");
            return `
    <h2>Briefing</h2>
    <div class="toolbar"><button class="btn primary" data-action="generate-digest">Generar briefing de las últimas 24 h</button></div>
    <div class="card digest">
      ${digest ? `<p class="muted">Generado ${formatTime(digest.created_at)}</p>${markdown(digest.content)}` : `<p class="muted">Todavía no hay ningún briefing.</p>`}
    </div>`;
        }

        // ---------- Router ----------
        const views = { overview: overviewView, events: eventsView, map: mapView, entities: entitiesView, articles: articlesView, categories: categoriesView, sources: sourcesView, digest: digestView, settings: settingsView };
        const hooks = { map: mapHook };

        function currentView() {
            const requested = location.hash.slice(1);
            return requested in views ? requested : "overview";
        }

        async function render() {
            clearTableObservers();
            const name = currentView();
            document.querySelectorAll("nav a").forEach((link) => link.classList.toggle("active", link.dataset.view === name));
            try {
                const result = await views[name]();
                if (typeof result === "string") {
                    $("#view").innerHTML = result;
                } else {
                    $("#view").innerHTML = result.html;
                    result.mount?.();
                }
                await hooks[name]?.();
            } catch (error) {
                $("#view").innerHTML = `<div class="banner">${esc(error.message)}</div>`;
            }
        }

        // ---------- Acciones y formularios ----------
        const actions = {
            async "run-pipeline"() {
                toast("Ejecutando ciclo…");
                const result = await api("/pipeline/run", { method: "POST" });
                toast(result.skipped
                    ? "Ya hay un ciclo en marcha"
                    : `Ciclo completado: ${result.ingest.articlesAdded} artículos nuevos, ${result.processing.processed} procesados, ${result.enrichment.enriched} eventos enriquecidos`);
                await render();
            },
            async enrich() {
                toast("Enriqueciendo eventos…");
                const result = await api("/pipeline/enrich", { method: "POST" });
                if (result.skipped) toast(result.skipped, true);
                else if (result.error) toast(`Error: ${result.error}`, true);
                else toast(`${result.enriched} eventos enriquecidos, ${result.located} lugares geocodificados`);
                await render();
            },
            async reclassify() {
                const { reclassified } = await api("/pipeline/reclassify", { method: "POST" });
                toast(`${reclassified} artículos reclasificados`);
                await render();
            },
            async reembed() {
                if (!confirm("Se recalcularán embeddings, eventos, entidades y categorías de todos los artículos. ¿Continuar?")) return;
                await api("/pipeline/reembed", { method: "POST" });
                state.entityId = null;
                toast("Reindexación programada: se procesará en los próximos ciclos");
                await render();
            },
            async "toggle-event"(el, event) {
                event.preventDefault();
                const box = $(`#event-${el.dataset.id}`);
                if (box.innerHTML) { box.innerHTML = ""; return; }

                const { event: detail, articles } = await api(`/events/${el.dataset.id}`);
                const withRole = (list, cls) => list.map((e) => `${entityChip(e, cls)}<span class="muted">${esc(e.role)}</span> `).join("") || `<span class="muted">—</span>`;
                box.innerHTML = `
          <div><b>Actores:</b> ${withRole(detail.actors, "actor")}</div>
          <div><b>Lugares:</b> ${withRole(detail.locations, "place")}</div>
          <div><b>Artículos:</b></div>
          ${articles.map((a) => `<div><a href="${safeHref(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a> · ${esc(a.source)} · ${formatTime(a.published_at)}</div>`).join("")}`;
            },
            async "open-entity"(el, event) {
                event.preventDefault();
                state.entityId = Number(el.dataset.id);
                if (location.hash === "#entities") await render();
                else location.hash = "#entities";
            },
            async "close-entity"() { state.entityId = null; await render(); },
            async page(el) {
                state.articles.offset = Math.max(0, state.articles.offset + Number(el.dataset.step) * state.articles.limit);
                await render();
            },
            async "clear-filters"(el) {
                const scope = el.dataset.scope;
                if (scope === "events") {
                    state.eventHours = 24;
                    state.eventStatus = "";
                    state.eventType = "";
                    state.eventsClient = { q: "", category: "", enriched: "", minSources: 0 };
                    state.pages.events.page = 0;
                } else if (scope === "entities") {
                    state.entities = { kind: "", hours: 168, q: "", subtype: "", country: "", hasCoords: "", minEvents: 0 };
                    state.pages.entities.page = 0;
                } else if (scope === "articles") {
                    state.articles = { q: "", category: "", source: "", status: "", offset: 0, limit: 100 };
                } else if (scope === "sources") {
                    state.sources = { q: "", type: "", onlyErrors: false, enabled: "" };
                    state.pages.sources.page = 0;
                }
                await render();
            },
            async "delete-category"(el) {
                if (!confirm("¿Eliminar la categoría?")) return;
                await api(`/categories/${el.dataset.id}`, { method: "DELETE" });
                await render();
            },
            async "toggle-source"(el) {
                await api(`/sources/${el.dataset.id}`, { method: "PATCH", body: { enabled: el.checked } });
                const src = cachedSources.find((s) => s.id === Number(el.dataset.id));
                if (src) src.enabled = el.checked ? 1 : 0;
            },
            async "edit-source"(el) {
                const id = Number(el.dataset.id);
                state.editingSourceId = state.editingSourceId === id ? null : id;
                renderTable("sources");
            },
            async "cancel-edit-source"() {
                state.editingSourceId = null;
                renderTable("sources");
            },
            async "seed-sources"() {
                const { added } = await api("/sources/defaults", { method: "POST" });
                toast(added ? `${added} fuentes nuevas añadidas` : "Ya tienes todas las fuentes recomendadas");
                await render();
            },
            async "fetch-source"(el) {
                toast("Descargando fuente…");
                const { added } = await api(`/sources/${el.dataset.id}/fetch`, { method: "POST" });
                toast(`${added} artículos nuevos`);
                await render();
            },
            async "delete-source"(el) {
                if (!confirm("¿Eliminar la fuente y sus artículos?")) return;
                if (state.editingSourceId === Number(el.dataset.id)) state.editingSourceId = null;
                await api(`/sources/${el.dataset.id}`, { method: "DELETE" });
                await render();
            },
            async "generate-digest"() {
                toast("Generando briefing…");
                await api("/digest", { method: "POST" });
                await render();
            },
        };

        function formValues(form) {
            const values = {};
            for (const input of form.querySelectorAll("[name]")) {
                values[input.name] = input.type === "checkbox" ? input.checked : input.type === "number" ? Number(input.value) : input.value;
            }
            return values;
        }

        const forms = {
            async category(form) {
                const id = form.dataset.id;
                await api(id ? `/categories/${id}` : "/categories", { method: id ? "PATCH" : "POST", body: formValues(form) });
                toast("Categoría guardada");
                await render();
            },
            async source(form) {
                await api("/sources", { method: "POST", body: formValues(form) });
                toast("Fuente añadida");
                await render();
            },
            async "edit-source"(form) {
                const id = form.dataset.id;
                await api(`/sources/${id}`, { method: "PATCH", body: formValues(form) });
                state.editingSourceId = null;
                toast("Fuente actualizada");
                await render();
            },
            async settings(form) {
                await api("/settings", { method: "PUT", body: formValues(form) });
                toast("Ajustes guardados");
            },
            async "article-filters"(form) {
                const values = formValues(form);
                state.articles = { ...state.articles, q: values.q, category: values.category, source: values.source, limit: Number(values.limit) || 100, offset: 0 };
                await render();
            },
            async "event-filters"(form) {
                const values = formValues(form);
                state.eventHours = Number(values.hours);
                state.eventStatus = values.status ?? "";
                if ("type" in values) state.eventType = values.type;
                state.pages.events.page = 0;
                if (currentView() === "map" && map) await refreshMapData({ fit: true });
                else await render();
            },
            async "entity-filters"(form) {
                const values = formValues(form);
                state.entities = { ...state.entities, kind: values.kind, hours: Number(values.hours), q: values.q.trim() };
                state.pages.entities.page = 0;
                await render();
            },
        };

        async function run(task) {
            try { await task(); } catch (error) { toast(error.message, true); }
        }

        function applyLiveFilter(el) {
            const key = el.dataset.liveFilter;
            if (key === "overview-trend-q") {
                state.overview.trendQ = el.value.trim();
                state.pages["overview-trends"].page = 0;
                renderTable("overview-trends");
            } else if (key === "overview-trend-anom") {
                state.overview.onlyAnomalies = el.checked;
                state.pages["overview-trends"].page = 0;
                renderTable("overview-trends");
            } else if (key === "overview-run-q") {
                state.overview.runQ = el.value.trim();
                state.pages["overview-runs"].page = 0;
                renderTable("overview-runs");
            } else if (key === "overview-run-status") {
                state.overview.runStatus = el.value;
                state.pages["overview-runs"].page = 0;
                renderTable("overview-runs");
            } else if (key === "events-q") {
                state.eventsClient.q = el.value.trim();
                state.pages.events.page = 0;
                renderTable("events");
            } else if (key === "events-category") {
                state.eventsClient.category = el.value;
                state.pages.events.page = 0;
                renderTable("events");
            } else if (key === "events-enriched") {
                state.eventsClient.enriched = el.value;
                state.pages.events.page = 0;
                renderTable("events");
            } else if (key === "events-min-sources") {
                state.eventsClient.minSources = Number(el.value);
                state.pages.events.page = 0;
                renderTable("events");
            } else if (key === "entities-q") {
                state.entities.q = el.value.trim();
                state.pages.entities.page = 0;
                renderTable("entities");
            } else if (key === "entities-subtype") {
                state.entities.subtype = el.value;
                state.pages.entities.page = 0;
                renderTable("entities");
            } else if (key === "entities-country") {
                state.entities.country = el.value;
                state.pages.entities.page = 0;
                renderTable("entities");
            } else if (key === "entities-coords") {
                state.entities.hasCoords = el.value;
                state.pages.entities.page = 0;
                renderTable("entities");
            } else if (key === "entities-min-events") {
                state.entities.minEvents = Number(el.value);
                state.pages.entities.page = 0;
                renderTable("entities");
            } else if (key === "articles-status") {
                state.articles.status = el.value;
                renderTable("articles");
            } else if (key === "sources-q") {
                state.sources.q = el.value.trim();
                state.pages.sources.page = 0;
                renderTable("sources");
            } else if (key === "sources-type") {
                state.sources.type = el.value;
                state.pages.sources.page = 0;
                renderTable("sources");
            } else if (key === "sources-enabled") {
                state.sources.enabled = el.value;
                state.pages.sources.page = 0;
                renderTable("sources");
            } else if (key === "sources-errors") {
                state.sources.onlyErrors = el.checked;
                state.pages.sources.page = 0;
                renderTable("sources");
            }
        }

        const debouncedLiveFilter = debounce(applyLiveFilter, 160);

        document.addEventListener("click", (event) => {
            const sortTh = event.target.closest("th[data-sort-table]");
            if (sortTh) {
                const tableId = sortTh.dataset.sortTable;
                const key = sortTh.dataset.sortKey;
                const current = state.sorts[tableId];
                const dir = current && current.key === key && current.dir === "desc" ? "asc" : "desc";
                state.sorts[tableId] = { key, dir };
                if (state.pages[tableId]) state.pages[tableId].page = 0;
                renderTable(tableId);
                return;
            }

            const pageBtn = event.target.closest("[data-table-page]");
            if (pageBtn) {
                const tableId = pageBtn.dataset.tablePage;
                state.pages[tableId].page += Number(pageBtn.dataset.step);
                renderTable(tableId);
                return;
            }

            const element = event.target.closest("[data-action]");
            if (element) run(() => actions[element.dataset.action](element, event));
        });

        document.addEventListener("submit", (event) => {
            const form = event.target.closest("[data-form]");
            if (!form) return;
            event.preventDefault();
            run(() => forms[form.dataset.form](form));
        });

        document.addEventListener("input", (event) => {
            const el = event.target.closest("[data-live-filter]");
            if (el && el.tagName === "INPUT" && el.type !== "checkbox") debouncedLiveFilter(el);
        });

        document.addEventListener("change", (event) => {
            const pageSizeSel = event.target.closest("[data-table-pagesize]");
            if (pageSizeSel) {
                const tableId = pageSizeSel.dataset.tablePagesize;
                state.pages[tableId].pageSize = Number(pageSizeSel.value);
                state.pages[tableId].page = 0;
                renderTable(tableId);
                return;
            }

            const liveEl = event.target.closest("[data-live-filter]");
            if (liveEl && (liveEl.tagName === "SELECT" || liveEl.type === "checkbox")) {
                applyLiveFilter(liveEl);
                return;
            }

            const form = event.target.closest("form[data-autosubmit]");
            if (form && (event.target.tagName === "SELECT" || event.target.type === "checkbox")) form.requestSubmit();
        });

        window.addEventListener("hashchange", render);
        render();
    </script>
</body>

</html>
