<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radar OSINT · Admin</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1218;
            --panel: #161b26;
            --panel-2: #1e2433;
            --line: #262d3d;
            --text: #d7dbe6;
            --muted: #939bb0;
            --green: #1ed760;
            --blue: #2962ff;
            --red: #f23645;
            --amber: #f5a524;
            --violet: #a78bfa;
        }

        * {
            box-sizing: border-box;
        }

        :focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }

        body {
            margin: 0;
            display: flex;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 Inter, system-ui, sans-serif;
        }

        aside {
            width: 210px;
            padding: 20px 12px;
            background: #0b0e14;
            border-right: 1px solid var(--line);
            position: sticky;
            top: 0;
            height: 100vh;
        }

        aside h1 {
            font-size: 15px;
            margin: 0 8px 20px;
            letter-spacing: .5px;
        }

        aside h1 span {
            color: var(--green);
        }

        nav a {
            display: block;
            padding: 9px 12px;
            border-radius: 8px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
        }

        nav a:hover {
            color: var(--text);
        }

        nav a.active {
            background: var(--panel-2);
            color: var(--text);
        }

        main {
            flex: 1;
            padding: 24px 28px;
            min-width: 0;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 20px;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        a {
            color: var(--text);
        }

        .muted {
            color: var(--muted);
        }

        .up {
            color: var(--green);
        }

        .down {
            color: var(--red);
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 16px;
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .kpi {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .kpi b {
            display: block;
            font-size: 26px;
        }

        .kpi span {
            color: var(--muted);
            font-size: 12px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }

        .banner {
            background: #3a2c0a;
            border: 1px solid var(--amber);
            color: var(--amber);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 8px;
        }

        td {
            padding: 8px;
            border-top: 1px solid var(--line);
            vertical-align: top;
        }

        input,
        select,
        textarea {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 10px;
            font: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 1px solid var(--blue);
        }

        textarea {
            width: 100%;
            margin: 8px 0;
            resize: vertical;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        label.check {
            flex-direction: row;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            align-items: end;
        }

        .btn {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 16px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            border-color: var(--muted);
        }

        .btn:disabled {
            opacity: .4;
            cursor: default;
        }

        .btn.primary {
            background: var(--green);
            color: #000;
            border-color: var(--green);
        }

        .btn.danger {
            color: var(--red);
        }

        .chip {
            display: inline-block;
            padding: 1px 9px;
            border-radius: 999px;
            background: var(--panel-2);
            font-size: 12px;
            margin: 0 4px 2px 0;
            border: 1px solid transparent;
        }

        .chip.alert {
            background: #3b1219;
            color: var(--red);
        }

        .chip.clickable {
            cursor: pointer;
        }

        .chip.clickable:hover {
            border-color: var(--muted);
        }

        .chip.actor {
            background: #241d3b;
            color: var(--violet);
        }

        .chip.place {
            background: #12233f;
            color: #7ea6ff;
        }

        .chip.type {
            background: transparent;
            border-color: var(--line);
            color: var(--muted);
        }

        .chip.status-active {
            background: #0f2b1b;
            color: var(--green);
        }

        .chip.status-cooling {
            background: #3a2c0a;
            color: var(--amber);
        }

        .chip.status-expired {
            background: var(--panel-2);
            color: #b4bcd0;
        }

        .event-summary {
            color: var(--muted);
            font-size: 13px;
            margin-top: 2px;
        }

        .detail {
            margin-top: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        .detail div {
            padding: 2px 0;
        }

        .detail b {
            color: var(--text);
        }

        .error {
            color: var(--red);
            font-size: 12px;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .source-url {
            font-size: 12px;
            color: var(--muted);
            max-width: 340px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .edit-row td {
            background: var(--panel-2);
            padding: 14px 16px;
        }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 130px;
        }

        .bar {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
        }

        .bar i {
            display: block;
            width: 100%;
            background: var(--blue);
            border-radius: 4px 4px 0 0;
            min-height: 2px;
        }

        .bar span {
            font-size: 12px;
            color: var(--muted);
        }

        .spark {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 22px;
        }

        .spark i {
            display: block;
            width: 6px;
            background: var(--green);
            opacity: .8;
        }

        .digest h3 {
            color: var(--text);
            text-transform: none;
            font-size: 16px;
            margin-top: 18px;
        }

        .digest li {
            margin-left: 18px;
        }

        /* ---- Mapa (Mapbox GL JS) ---- */
        .map-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }

        .map-meta p {
            margin: 0;
        }

        .map-legend {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 12px;
            color: var(--muted);
        }

        .map-legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .map-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid currentColor;
        }

        .map-dot.active {
            color: var(--green);
            background: rgba(30, 215, 96, .35);
        }

        .map-dot.inactive {
            color: var(--muted);
            background: rgba(147, 155, 176, .3);
        }

        #event-map {
            height: 68vh;
            min-height: 380px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #0b0e14;
            overflow: hidden;
        }

        #event-map .mapboxgl-popup-content {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 34px 12px 14px;
            font: 13px/1.5 Inter, system-ui, sans-serif;
            max-height: 300px;
            overflow: auto;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .65);
        }

        #event-map .mapboxgl-popup-content a {
            color: #7ea6ff;
        }

        #event-map .mapboxgl-popup-close-button {
            color: var(--muted);
            font-size: 18px;
            width: 28px;
            height: 28px;
            top: 6px;
            right: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
        }

        #event-map .mapboxgl-popup-close-button:hover,
        #event-map .mapboxgl-popup-close-button:focus-visible {
            background: var(--panel-2);
            color: var(--text);
        }

        #event-map .mapboxgl-popup-anchor-top .mapboxgl-popup-tip,
        #event-map .mapboxgl-popup-anchor-top-left .mapboxgl-popup-tip,
        #event-map .mapboxgl-popup-anchor-top-right .mapboxgl-popup-tip {
            border-bottom-color: var(--panel);
        }

        #event-map .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip,
        #event-map .mapboxgl-popup-anchor-bottom-left .mapboxgl-popup-tip,
        #event-map .mapboxgl-popup-anchor-bottom-right .mapboxgl-popup-tip {
            border-top-color: var(--panel);
        }

        #event-map .mapboxgl-popup-anchor-left .mapboxgl-popup-tip {
            border-right-color: var(--panel);
        }

        #event-map .mapboxgl-popup-anchor-right .mapboxgl-popup-tip {
            border-left-color: var(--panel);
        }

        /* Controles y atribución de Mapbox en modo oscuro y accesibles */
        #event-map .mapboxgl-ctrl-group {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
            overflow: hidden;
        }

        #event-map .mapboxgl-ctrl-group button {
            background-color: transparent;
            width: 32px;
            height: 32px;
        }

        #event-map .mapboxgl-ctrl-group button+button {
            border-top: 1px solid var(--line);
        }

        #event-map .mapboxgl-ctrl-group button:hover,
        #event-map .mapboxgl-ctrl-group button:focus-visible {
            background-color: var(--panel-2);
        }

        #event-map .mapboxgl-ctrl-group button .mapboxgl-ctrl-icon {
            filter: invert(0.9);
        }

        #event-map .mapboxgl-ctrl-group button:disabled .mapboxgl-ctrl-icon {
            opacity: .35;
        }

        #event-map .mapboxgl-ctrl-attrib {
            background-color: rgba(15, 18, 24, .88);
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 6px;
            margin: 0 8px 8px 0;
            padding: 2px 8px;
            font-size: 11px;
            backdrop-filter: blur(4px);
        }

        #event-map .mapboxgl-ctrl-attrib a {
            color: var(--text);
            text-decoration: none;
        }

        #event-map .mapboxgl-ctrl-attrib a:hover {
            text-decoration: underline;
        }

        #event-map .mapboxgl-ctrl-attrib.mapboxgl-compact {
            background-color: rgba(15, 18, 24, .92);
            padding: 0;
            min-height: 26px;
            min-width: 26px;
            border-radius: 999px;
        }

        #event-map .mapboxgl-ctrl-attrib.mapboxgl-compact-show {
            padding: 2px 28px 2px 10px;
        }

        #event-map .mapboxgl-ctrl-attrib-button {
            background-color: transparent;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='%23d7dbe6'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z'/%3E%3C/svg%3E");
            background-position: center;
            background-repeat: no-repeat;
            background-size: 18px 18px;
            width: 26px;
            height: 26px;
            border-radius: 999px;
        }

        #event-map .mapboxgl-ctrl-attrib-button:hover {
            background-color: var(--panel-2);
        }

        .map-popup-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .map-popup-item {
            padding: 6px 0;
            border-top: 1px solid var(--line);
        }

        .map-popup-meta {
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 16px;
            display: none;
            max-width: 420px;
            z-index: 2000;
        }

        #toast.error {
            border-color: var(--red);
            color: var(--red);
        }
    </style>
</head>

<body>
    <aside>
        <h1>RADAR <span>OSINT</span></h1>
        <nav>
            <a href="#overview" data-view="overview">Resumen</a>
            <a href="#events" data-view="events">Eventos</a>
            <a href="#map" data-view="map">Mapa</a>
            <a href="#entities" data-view="entities">Entidades</a>
            <a href="#articles" data-view="articles">Artículos</a>
            <a href="#categories" data-view="categories">Categorías</a>
            <a href="#sources" data-view="sources">Fuentes</a>
            <a href="#digest" data-view="digest">Briefing</a>
            <a href="#settings" data-view="settings">Ajustes</a>
        </nav>
    </aside>
    <main>
        <div id="view"></div>
    </main>
    <div id="toast"></div>

    <script>
        // ---------- Utilidades ----------
        const $ = (selector) => document.querySelector(selector);
        const esc = (value) =>
            String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
        const safeHref = (url) => (/^https?:\/\//i.test(url) ? esc(url) : "#");
        const formatTime = (ts) => (ts ? new Date(ts).toLocaleString("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "—");
        const timeAgo = (ts) => {
            if (!ts) return "nunca";
            const minutes = Math.round((Date.now() - ts) / 60000);
            if (minutes < 1) return "ahora";
            if (minutes < 60) return `hace ${minutes} min`;
            const hours = Math.round(minutes / 60);
            return hours < 48 ? `hace ${hours} h` : `hace ${Math.round(hours / 24)} d`;
        };
        const chips = (names) => names.map((name) => `<span class="chip">${esc(name)}</span>`).join("");

        function markdown(text) {
            const bold = (line) => line.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
            return esc(text).split("\n").map((line) => {
                const heading = line.match(/^#{1,4}\s+(.*)/);
                if (heading) return `<h3>${bold(heading[1])}</h3>`;
                if (/^[-*]\s/.test(line)) return `<li>${bold(line.slice(2))}</li>`;
                return line.trim() ? `<p>${bold(line)}</p>` : "";
            }).join("");
        }

        function toast(message, isError = false) {
            const box = $("#toast");
            box.textContent = message;
            box.className = isError ? "error" : "";
            box.style.display = "block";
            setTimeout(() => (box.style.display = "none"), 4000);
        }

        // ---------- API ----------
        let token = localStorage.getItem("adminToken") ?? "";

        async function api(path, { method = "GET", body, signal } = {}) {
            const headers = { "content-type": "application/json" };
            if (token) headers.authorization = `Bearer ${token}`;

            const response = await fetch(`/api${path}`, {
                method,
                headers,
                body: body === undefined ? undefined : JSON.stringify(body),
                signal,
            });

            if (response.status === 401) {
                const input = prompt("Token de administrador (ADMIN_TOKEN):");
                if (input === null) throw new Error("Token requerido");
                token = input.trim();
                localStorage.setItem("adminToken", token);
                return api(path, { method, body, signal });
            }
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error ?? `HTTP ${response.status}`);
            }
            return response.json();
        }

        // ---------- Estado de la interfaz ----------
        const state = {
            eventHours: 24,
            eventStatus: "",
            eventType: "",
            articles: { q: "", category: "", source: "", offset: 0 },
            entities: { kind: "", hours: 168, q: "" },
            entityId: null,
            sources: { q: "", type: "", onlyErrors: false },
            editingSourceId: null,
        };
        const ARTICLES_PER_PAGE = 50;
        const HOUR_LABELS = { 24: "Últimas 24 h", 48: "Últimas 48 h", 168: "Últimos 7 días", 720: "Últimos 30 días" };
        const ENTITY_HOUR_LABELS = { 24: "24 h", 168: "7 días", 720: "30 días", 0: "Todo el histórico" };
        const STATUS_LABELS = { active: "Activo", cooling: "Enfriándose", expired: "Caducado" };

        const statusChip = (status) => `<span class="chip status-${esc(status)}">${esc(STATUS_LABELS[status] ?? status)}</span>`;
        const entityTitle = (e) => [e.role, e.subtype, e.country_code, e.lat != null ? `${e.lat.toFixed(2)}, ${e.lon.toFixed(2)}` : ""].filter(Boolean).join(" · ");
        const entityChip = (e, cls) =>
            `<span class="chip clickable ${cls}" data-action="open-entity" data-id="${e.id}" title="${esc(entityTitle(e))}">${esc(e.name)}</span>`;
        const entityLink = (e) => `<a href="#" data-action="open-entity" data-id="${e.id}">${esc(e.name)}</a>`;
        const options = (items, selected, label = (item) => item.name, value = (item) => item.id) =>
            items.map((item) => `<option value="${esc(value(item))}" ${String(value(item)) === String(selected) ? "selected" : ""}>${esc(label(item))}</option>`).join("");

        // ---------- Vistas ----------
        const kpi = (label, value, extraClass = "") => `<div class="kpi"><b class="${extraClass}">${value}</b><span>${label}</span></div>`;

        const topEntitiesCard = (title, items) => `
    <div class="card">
      <h3>${title}</h3>
      <table>
        <thead><tr><th>Nombre</th><th>Tipo</th><th>Eventos 24 h</th></tr></thead>
        <tbody>${items.map((e) => `<tr><td>${entityLink(e)}</td><td class="muted">${esc(e.subtype ?? "—")}</td><td>${e.recent_events}</td></tr>`).join("")
            || `<tr><td colspan="3" class="muted">Todavía sin datos: se generan al enriquecer eventos</td></tr>`}</tbody>
      </table>
    </div>`;

        async function overviewView() {
            const [overview, trends, runs, actors, places] = await Promise.all([
                api("/overview"), api("/trends"), api("/runs"),
                api("/entities?kind=actor&hours=24&limit=8"),
                api("/entities?kind=location&hours=24&limit=8"),
            ]);
            const volume = [...overview.dailyVolume].reverse();
            const maxVolume = Math.max(1, ...volume);

            return `
    <h2>Resumen</h2>
    ${overview.geminiConfigured ? "" : `<div class="banner">Falta <b>GEMINI_API_KEY</b>: se descargan artículos, pero no se clasifican ni se enriquecen los eventos.</div>`}
    <div class="toolbar">
      <button class="btn primary" data-action="run-pipeline">Ejecutar ciclo ahora</button>
      <button class="btn" data-action="enrich">Enriquecer eventos</button>
      <button class="btn" data-action="reclassify">Reclasificar</button>
      <button class="btn danger" data-action="reembed">Reindexar todo</button>
    </div>
    <div class="kpis">
      ${kpi("Artículos (24 h)", overview.articles24h)}
      ${kpi("Eventos (24 h)", overview.events24h)}
      ${kpi("Eventos activos ahora", overview.eventsActive, "up")}
      ${kpi("Enriquecidos (24 h)", `${overview.eventsEnriched24h}/${overview.events24h}`)}
      ${kpi("Sin categoría (24 h)", overview.unclassified24h, overview.unclassified24h > overview.articles24h / 2 ? "down" : "")}
      ${kpi("Pendientes de procesar", overview.pending)}
      ${kpi("Entidades", overview.entitiesTotal)}
      ${kpi("Lugares con coordenadas", overview.locationsLocated)}
      ${kpi("Fuentes activas", overview.sourcesEnabled)}
      ${kpi("Fuentes con error", overview.sourcesFailing, overview.sourcesFailing ? "down" : "up")}
      ${kpi("Artículos totales", overview.articlesTotal)}
    </div>

    <div class="card">
      <h3>Volumen diario (más antiguo → últimas 24 h)</h3>
      <div class="bars">${volume.map((n) => `<div class="bar"><span>${n}</span><i style="height:${(n / maxVolume) * 85}%"></i></div>`).join("")}</div>
    </div>

    <div class="grid-2">
      ${topEntitiesCard("Actores más activos (24 h)", actors)}
      ${topEntitiesCard("Lugares más activos (24 h)", places)}
    </div>

    <div class="card">
      <h3>Tendencia por categoría</h3>
      <table>
        <thead><tr><th>Categoría</th><th>24 h</th><th>Media previa</th><th>z</th><th>7 días</th><th></th></tr></thead>

        // ---------- Mapa (Mapbox GL JS, se carga solo al abrir la vista) ----------
        const MAPBOX_VERSION = "v3.28.0";
        const MAPBOX_BASE = `https://api.mapbox.com/mapbox-gl-js/${MAPBOX_VERSION}/mapbox-gl`;
        const MAP_STYLE = "mapbox://styles/mapbox/dark-v11";

        /**
         * Mapbox cobra por cada carga de mapa (cada `new Map`), así que se crea UNA sola instancia
         * y se reutiliza: su contenedor vive en memoria y se coloca en la vista Mapa al entrar.
         * Cambiar filtros o salir y volver no recrea el mapa; solo se actualizan los datos.
         */
        const mapEl = Object.assign(document.createElement("div"), { id: "event-map" });
        let mapboxToken;
        let mapboxReady;
        let map;
        let mapLoaded;
        let mapPopup;
        let mapGroups = new Map();
        let mapAbort;
        let mapFitted = false;

        function appendAndWait(element, prepend = false) {
            return new Promise((resolve, reject) => {
                element.onload = resolve;
                element.onerror = () => {
                    element.remove();
                    reject(new Error("No se pudo cargar Mapbox GL JS (¿sin conexión?)"));
                };
                if (prepend) document.head.prepend(element);
                else document.head.append(element);
            });
        }

        function loadMapbox() {
            mapboxReady ??= (async () => {
                const css = Object.assign(document.createElement("link"), { rel: "stylesheet", href: `${MAPBOX_BASE}.css` });
                const script = Object.assign(document.createElement("script"), { src: `${MAPBOX_BASE}.js` });
                // Se inserta el CSS antes de <style> para que los estilos oscuros del mapa tengan prioridad.
                await Promise.all([appendAndWait(css, true), appendAndWait(script)]);
                return window.mapboxgl;
            })().catch((error) => { mapboxReady = undefined; throw error; });
            return mapboxReady;
        }

        async function getMapboxToken() {
            if (mapboxToken === undefined) mapboxToken = (await api("/config")).mapboxToken || "";
            return mapboxToken;
        }

        /** Donde ocurre el evento: primero "occurred", si no cualquier lugar con coordenadas. */
        const primaryPlace = (event) =>
            event.locations.find((p) => p.role === "occurred" && p.lat != null) ?? event.locations.find((p) => p.lat != null);

        function popupHtml({ place, events }) {
            const shown = events.slice(0, 8).map((e) => `
          <div class="map-popup-item">
            <div>${statusChip(e.status)} ${esc(e.title)}</div>
            <div class="map-popup-meta">${e.source_count} medios · primera noticia ${timeAgo(e.first_seen_at)}</div>
          </div>`).join("");
            const more = events.length > 8 ? `<div class="map-popup-meta">+${events.length - 8} más</div>` : "";
            const placeMeta = [place.country_code, `${events.length} ${events.length === 1 ? "evento" : "eventos"}`].filter(Boolean).join(" · ");
            return `
        <div class="map-popup">
          <div class="map-popup-head">
            <b>${esc(place.name)}</b>
            <span class="muted" style="font-size:12px">${esc(placeMeta)}</span>
          </div>
          ${shown}${more}
        </div>`;
        }

        function buildMapData(events) {
            const groups = new Map();
            let located = 0;
            for (const event of events) {
                const place = primaryPlace(event);
                if (!place) continue;
                located++;
                const group = groups.get(place.id) ?? { place, events: [] };
                group.events.push(event);
                groups.set(place.id, group);
            }

            const features = [...groups.values()].map(({ place, events: list }) => {
                const sources = list.reduce((sum, e) => sum + e.source_count, 0);
                return {
                    type: "Feature",
                    geometry: { type: "Point", coordinates: [place.lon, place.lat] },
                    properties: {
                        id: place.id,
                        radius: 5 + Math.min(18, Math.sqrt(sources) * 2.5),
                        active: list.some((e) => e.status === "active"),
                    },
                };
            });

            return { groups, features, located, total: events.length };
        }

        function computeBounds(mapboxgl, features) {
            if (!features.length) return null;
            const bounds = new mapboxgl.LngLatBounds();
            for (const feature of features) bounds.extend(feature.geometry.coordinates);
            return bounds;
        }

        async function fetchMapEvents() {
            mapAbort?.abort();
            mapAbort = new AbortController();
            const query = new URLSearchParams({ hours: state.eventHours, limit: 200 });
            if (state.eventStatus) query.set("status", state.eventStatus);
            return api(`/events?${query}`, { signal: mapAbort.signal });
        }

        function addEventLayers(initialFeatures) {
            map.addSource("events", {
                type: "geojson",
                data: { type: "FeatureCollection", features: initialFeatures },
            });
            const color = ["case", ["get", "active"], "#1ed760", "#939bb0"];
            map.addLayer({
                id: "events-circles",
                type: "circle",
                source: "events",
                // Los círculos pequeños se dibujan encima de los grandes para que todos se puedan pulsar.
                layout: { "circle-sort-key": ["-", ["get", "radius"]] },
                paint: {
                    "circle-radius": ["get", "radius"],
                    "circle-color": color,
                    "circle-opacity": 0.35,
                    "circle-stroke-width": 2,
                    "circle-stroke-color": color,
                },
            });

            map.on("click", "events-circles", (event) => {
                const feature = event.features?.[0];
                const group = feature && mapGroups.get(Number(feature.properties.id));
                if (!group) return;

                // Con varias copias del mundo visibles, el popup debe salir en la copia pulsada.
                const coordinates = feature.geometry.coordinates.slice();
                while (Math.abs(event.lngLat.lng - coordinates[0]) > 180) {
                    coordinates[0] += event.lngLat.lng > coordinates[0] ? 360 : -360;
                }
                mapPopup?.remove();
                mapPopup = new window.mapboxgl.Popup({ maxWidth: "360px", offset: Number(feature.properties.radius) + 2 })
                    .setLngLat(coordinates)
                    .setHTML(popupHtml(group))
                    .addTo(map);
            });
            map.on("mouseenter", "events-circles", () => { map.getCanvas().style.cursor = "pointer"; });
            map.on("mouseleave", "events-circles", () => { map.getCanvas().style.cursor = ""; });
        }

        function createMap(mapboxgl, accessToken, { initialFeatures, bounds }) {
            mapboxgl.accessToken = accessToken;
            const mapOptions = {
                container: mapEl,
                style: MAP_STYLE,
                projection: "mercator",
            };
            if (bounds) {
                mapOptions.bounds = bounds;
                mapOptions.fitBoundsOptions = { padding: 70, maxZoom: 5 };
                mapFitted = true;
            } else {
                mapOptions.center = [20, 30];
                mapOptions.zoom = 1.6;
            }

            map = new mapboxgl.Map(mapOptions);
            map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
            mapLoaded = new Promise((resolve) => map.once("load", () => { addEventLayers(initialFeatures); resolve(); }));

            // Token inválido, caducado o restringido por URL: se descarta el mapa para poder reintentar.
            map.on("error", (event) => {
                const status = event.error?.status;
                if (status !== 401 && status !== 403) return;
                map.remove();
                map = undefined;
                mapboxToken = undefined;
                mapFitted = false;
                const message = "Mapbox rechazó el token (¿caducado, sin permisos o restringido a otras URL?)";
                $("#map-slot")?.replaceChildren(Object.assign(document.createElement("div"), { className: "banner", textContent: message }));
                const count = $("#map-count");
                if (count) count.textContent = "";
                toast(message, true);
            });
        }

        function updateMapCount(data) {
            const count = $("#map-count");
            if (count) count.textContent = `${data.located} de ${data.total} eventos con localización · ${data.groups.size} lugares`;
        }

        /** Pide los eventos con los filtros actuales y actualiza el mapa sin recrearlo. */
        async function refreshMapData({ fit = false } = {}) {
            try {
                const events = await fetchMapEvents();
                await mapLoaded;
                if (!map) return;

                const data = buildMapData(events);
                mapGroups = data.groups;

                mapPopup?.remove();
                map.getSource("events").setData({ type: "FeatureCollection", features: data.features });

                if (fit && data.features.length) {
                    const bounds = computeBounds(window.mapboxgl, data.features);
                    map.fitBounds(bounds, { padding: 70, maxZoom: 5, duration: 500 });
                    mapFitted = true;
                }

                updateMapCount(data);
            } catch (error) {
                if (error.name !== "AbortError") toast(error.message, true);
            }
        }

        async function mapView() {
            return `
    <h2>Mapa</h2>
    ${eventFilterForm()}
    <div class="map-meta">
      <p class="muted" id="map-count">Cargando…</p>
      <div class="map-legend">
        <span><i class="map-dot active"></i> Activo</span>
        <span><i class="map-dot inactive"></i> Enfriándose / caducado</span>
      </div>
    </div>
    <div id="map-slot"></div>`;
        }

        async function mapHook() {
            const slot = $("#map-slot");
            try {
                if (map) {
                    slot.append(mapEl);
                    requestAnimationFrame(() => map?.resize());
                    await refreshMapData({ fit: !mapFitted });
                    return;
                }

                // Se cargan librería, token y eventos en paralelo para iniciar en el encuadre final sin cancelar teselas.
                const [mapboxgl, accessToken, events] = await Promise.all([
                    loadMapbox(),
                    getMapboxToken(),
                    fetchMapEvents(),
                ]);
                if (!slot.isConnected) return; // el usuario ya cambió de vista
                if (!accessToken) throw new Error("Falta MAPBOX_TOKEN en el .env del servidor (usa un token público, pk.…)");

                const data = buildMapData(events);
                mapGroups = data.groups;
                const bounds = computeBounds(mapboxgl, data.features);

                slot.append(mapEl);
                createMap(mapboxgl, accessToken, { initialFeatures: data.features, bounds });
                updateMapCount(data);
            } catch (error) {
                if (error.name === "AbortError") return;
                slot.replaceChildren(Object.assign(document.createElement("div"), { className: "banner", textContent: error.message }));
                const count = $("#map-count");
                if (count) count.textContent = "";
            }
        }

                if (filters.q) {
                    const needle = filters.q.toLowerCase();
                    if (!source.name.toLowerCase().includes(needle) && !source.url.toLowerCase().includes(needle)) return false;
                }
                return true;
            });
            const failingCount = sources.filter((s) => s.enabled && s.last_error).length;

            return `
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0">Fuentes <span class="muted" style="font-size:14px;font-weight:400">(${sources.length}${failingCount ? ` · <span class="down">${failingCount} con error</span>` : ""})</span></h2>
      <button class="btn" data-action="seed-sources">Añadir fuentes recomendadas</button>
    </div>
    <form class="card form-grid" data-form="source">
      <label>Nombre<input name="name" placeholder="p. ej. The Record" required maxlength="100"></label>
      <label>Tipo<select name="type"><option value="rss">RSS / Atom</option><option value="gdelt">GDELT (consulta)</option></select></label>
      <label>URL o consulta GDELT<input name="url" placeholder="https://… o (keyword1 OR keyword2) sourcelang:english" required maxlength="1000"></label>
      <label>Cada (min)<input name="interval_minutes" type="number" min="5" max="1440" value="30" required></label>
      <button class="btn primary">Añadir fuente</button>
    </form>
    <form class="toolbar" data-form="source-filters" data-autosubmit>
      <input name="q" placeholder="Buscar por nombre o URL" value="${esc(filters.q)}">
      <select name="type">
        <option value="">Todos los tipos</option>
        <option value="rss" ${filters.type === "rss" ? "selected" : ""}>Solo RSS / Atom</option>
        <option value="gdelt" ${filters.type === "gdelt" ? "selected" : ""}>Solo GDELT</option>
      </select>
      <label class="check"><input type="checkbox" name="onlyErrors" ${filters.onlyErrors ? "checked" : ""}> Solo con error</label>
      <button class="btn">Filtrar</button>
    </form>
    <div class="card"><table>
      <thead><tr><th>On</th><th>Fuente</th><th>Tipo</th><th>Cada</th><th>Última descarga</th><th>Artículos</th><th>Error</th><th></th></tr></thead>
      <tbody>${visible.map((source) => `
        <tr>
          <td><input type="checkbox" data-action="toggle-source" data-id="${source.id}" ${source.enabled ? "checked" : ""}></td>
          <td>
            <div>${esc(source.name)}</div>
            <div class="source-url" title="${esc(source.url)}">${esc(source.url)}</div>
          </td>
          <td class="muted">${source.type}</td>
          <td>${source.interval_minutes} min</td>
          <td class="muted">${timeAgo(source.last_fetched_at)}</td>
          <td>${source.articles_total}</td>
          <td class="error" title="${esc(source.last_error)}">${esc(source.last_error)}</td>
          <td><div class="actions-cell">
              <button class="btn" data-action="edit-source" data-id="${source.id}">${state.editingSourceId === source.id ? "Cerrar" : "Editar"}</button>
              <button class="btn" data-action="fetch-source" data-id="${source.id}">Descargar</button>
              <button class="btn danger" data-action="delete-source" data-id="${source.id}">×</button>
          </div></td>
        </tr>
        ${state.editingSourceId === source.id ? sourceEditRow(source) : ""}`).join("") || `<tr><td colspan="8" class="muted">Sin fuentes que coincidan con el filtro</td></tr>`}
      </tbody>
    </table></div>`;
        }

        const SETTING_GROUPS = [
            ["Eventos", {
                eventSimilarity: "Similitud mínima para agrupar en un evento (0.5 – 0.99)",
                eventWindowHours: "Ventana de agrupación: sin noticias más tiempo que esto = caducado (horas)",
                eventActiveMinHours: "Horas mínimas sin noticias antes de dejar de estar activo",
            }],
            ["Enriquecimiento (actores y lugares)", {
                enrichEnabled: "Enriquecimiento con LLM activado",
                enrichMinSources: "Medios mínimos para enriquecer un evento",
                enrichMaxEventsPerRun: "Eventos como máximo por ciclo",
                entityMergeSimilarity: "Similitud mínima para fusionar entidades duplicadas (0.7 – 0.99)",
                geocodingEnabled: "Geocodificación de lugares activada",
                entityRetentionDays: "Retención de entidades sin eventos (días)",
            }],
            ["Datos y planificador", {
                maxArticleAgeHours: "Antigüedad máxima de artículos al descargar (horas)",
                retentionDays: "Retención de artículos y eventos (días)",
                schedulerEnabled: "Planificador automático activado",
            }],
        ];
        const FLAG_SETTINGS = new Set(["schedulerEnabled", "enrichEnabled", "geocodingEnabled"]);

        async function settingsView() {
            const settings = await api("/settings");
            const field = ([key, label]) => FLAG_SETTINGS.has(key)
                ? `<label class="check"><input type="checkbox" name="${key}" ${settings[key] ? "checked" : ""}> ${label}</label>`
                : `<label>${label}<input type="number" step="any" name="${key}" value="${settings[key]}"></label>`;

            return `<h2>Ajustes</h2>
    <form data-form="settings">
      ${SETTING_GROUPS.map(([title, fields]) => `<div class="card"><h3>${title}</h3><div class="form-grid">${Object.entries(fields).map(field).join("")}</div></div>`).join("")}
      <button class="btn primary">Guardar</button>
    </form>`;
        }

        async function digestView() {
            const digest = await api("/digest");
            return `
    <h2>Briefing</h2>
    <div class="toolbar"><button class="btn primary" data-action="generate-digest">Generar briefing de las últimas 24 h</button></div>
    <div class="card digest">
      ${digest ? `<p class="muted">Generado ${formatTime(digest.created_at)}</p>${markdown(digest.content)}` : `<p class="muted">Todavía no hay ningún briefing.</p>`}
    </div>`;
        }

        // ---------- Router ----------
        const views = { overview: overviewView, events: eventsView, map: mapView, entities: entitiesView, articles: articlesView, categories: categoriesView, sources: sourcesView, digest: digestView, settings: settingsView };
        /** Código que necesita el DOM ya pintado. */
        const hooks = { map: mapHook };

        function currentView() {
            const requested = location.hash.slice(1);
            return requested in views ? requested : "overview";
        }

        async function render() {
            const name = currentView();
            document.querySelectorAll("nav a").forEach((link) => link.classList.toggle("active", link.dataset.view === name));
            try {
                $("#view").innerHTML = await views[name]();
                await hooks[name]?.();
            } catch (error) {
                $("#view").innerHTML = `<div class="banner">${esc(error.message)}</div>`;
            }
        }

        // ---------- Acciones y formularios ----------
        const actions = {
            async "run-pipeline"() {
                toast("Ejecutando ciclo…");
                const result = await api("/pipeline/run", { method: "POST" });
                toast(result.skipped
                    ? "Ya hay un ciclo en marcha"
                    : `Ciclo completado: ${result.ingest.articlesAdded} artículos nuevos, ${result.processing.processed} procesados, ${result.enrichment.enriched} eventos enriquecidos`);
                await render();
            },
            async enrich() {
                toast("Enriqueciendo eventos…");
                const result = await api("/pipeline/enrich", { method: "POST" });
                if (result.skipped) toast(result.skipped, true);
                else if (result.error) toast(`Error: ${result.error}`, true);
                else toast(`${result.enriched} eventos enriquecidos, ${result.located} lugares geocodificados`);
                await render();
            },
            async reclassify() {
                const { reclassified } = await api("/pipeline/reclassify", { method: "POST" });
                toast(`${reclassified} artículos reclasificados`);
                await render();
            },
            async reembed() {
                if (!confirm("Se recalcularán embeddings, eventos, entidades y categorías de todos los artículos. ¿Continuar?")) return;
                await api("/pipeline/reembed", { method: "POST" });
                state.entityId = null;
                toast("Reindexación programada: se procesará en los próximos ciclos");
                await render();
            },
            async "toggle-event"(el, event) {
                event.preventDefault();
                const box = $(`#event-${el.dataset.id}`);
                if (box.innerHTML) { box.innerHTML = ""; return; }

                const { event: detail, articles } = await api(`/events/${el.dataset.id}`);
                const withRole = (list, cls) => list.map((e) => `${entityChip(e, cls)}<span class="muted">${esc(e.role)}</span> `).join("") || `<span class="muted">—</span>`;
                box.innerHTML = `
          <div><b>Actores:</b> ${withRole(detail.actors, "actor")}</div>
          <div><b>Lugares:</b> ${withRole(detail.locations, "place")}</div>
          <div><b>Artículos:</b></div>
          ${articles.map((a) => `<div><a href="${safeHref(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a> · ${esc(a.source)} · ${formatTime(a.published_at)}</div>`).join("")}`;
            },
            async "open-entity"(el, event) {
                event.preventDefault();
                state.entityId = Number(el.dataset.id);
                if (location.hash === "#entities") await render();
                else location.hash = "#entities";
            },
            async "close-entity"() { state.entityId = null; await render(); },
            async page(el) {
                state.articles.offset = Math.max(0, state.articles.offset + Number(el.dataset.step) * ARTICLES_PER_PAGE);
                await render();
            },
            async "delete-category"(el) {
                if (!confirm("¿Eliminar la categoría?")) return;
                await api(`/categories/${el.dataset.id}`, { method: "DELETE" });
                await render();
            },
            async "toggle-source"(el) { await api(`/sources/${el.dataset.id}`, { method: "PATCH", body: { enabled: el.checked } }); },
            async "edit-source"(el) {
                const id = Number(el.dataset.id);
                state.editingSourceId = state.editingSourceId === id ? null : id;
                await render();
            },
            async "cancel-edit-source"() {
                state.editingSourceId = null;
                await render();
            },
            async "seed-sources"() {
                const { added } = await api("/sources/defaults", { method: "POST" });
                toast(added ? `${added} fuentes nuevas añadidas` : "Ya tienes todas las fuentes recomendadas");
                await render();
            },
            async "fetch-source"(el) {
                toast("Descargando fuente…");
                const { added } = await api(`/sources/${el.dataset.id}/fetch`, { method: "POST" });
                toast(`${added} artículos nuevos`);
                await render();
            },
            async "delete-source"(el) {
                if (!confirm("¿Eliminar la fuente y sus artículos?")) return;
                if (state.editingSourceId === Number(el.dataset.id)) state.editingSourceId = null;
                await api(`/sources/${el.dataset.id}`, { method: "DELETE" });
                await render();
            },
            async "generate-digest"() {
                toast("Generando briefing…");
                await api("/digest", { method: "POST" });
                await render();
            },
        };

        /** Convierte un formulario en objeto: números como number, checkboxes como boolean. */
        function formValues(form) {
            const values = {};
            for (const input of form.querySelectorAll("[name]")) {
                values[input.name] = input.type === "checkbox" ? input.checked : input.type === "number" ? Number(input.value) : input.value;
            }
            return values;
        }

        const forms = {
            async category(form) {
                const id = form.dataset.id;
                await api(id ? `/categories/${id}` : "/categories", { method: id ? "PATCH" : "POST", body: formValues(form) });
                toast("Categoría guardada");
                await render();
            },
            async source(form) {
                await api("/sources", { method: "POST", body: formValues(form) });
                toast("Fuente añadida");
                await render();
            },
            async "edit-source"(form) {
                const id = form.dataset.id;
                await api(`/sources/${id}`, { method: "PATCH", body: formValues(form) });
                state.editingSourceId = null;
                toast("Fuente actualizada");
                await render();
            },
            async "source-filters"(form) {
                const values = formValues(form);
                state.sources = { q: values.q.trim(), type: values.type, onlyErrors: values.onlyErrors };
                await render();
            },
            async settings(form) {
                await api("/settings", { method: "PUT", body: formValues(form) });
                toast("Ajustes guardados");
            },
            async "article-filters"(form) {
                state.articles = { ...formValues(form), offset: 0 };
                await render();
            },
            async "event-filters"(form) {
                const values = formValues(form);
                state.eventHours = Number(values.hours);
                state.eventStatus = values.status ?? "";
                if ("type" in values) state.eventType = values.type;
                // En el mapa solo se actualizan los datos: recrear el mapa costaría otra carga facturable de Mapbox.
                if (currentView() === "map" && map) await refreshMapData({ fit: true });
                else await render();
            },
            async "entity-filters"(form) {
                const values = formValues(form);
                state.entities = { kind: values.kind, hours: Number(values.hours), q: values.q.trim() };
                await render();
            },
        };

        async function run(task) {
            try { await task(); } catch (error) { toast(error.message, true); }
        }

        document.addEventListener("click", (event) => {
            const element = event.target.closest("[data-action]");
            if (element) run(() => actions[element.dataset.action](element, event));
        });
        document.addEventListener("submit", (event) => {
            const form = event.target.closest("[data-form]");
            if (!form) return;
            event.preventDefault();
            run(() => forms[form.dataset.form](form));
        });
        // Los desplegables y checkboxes de los filtros se aplican al cambiar; los campos de texto, con Enter.
        document.addEventListener("change", (event) => {
            const form = event.target.closest("form[data-autosubmit]");
            if (form && (event.target.tagName === "SELECT" || event.target.type === "checkbox")) form.requestSubmit();
        });
        window.addEventListener("hashchange", render);
        render();
    </script>
</body>

</html>
